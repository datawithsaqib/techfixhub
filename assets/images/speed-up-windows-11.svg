<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
<title id="t">Settings path to turn off startup apps in Windows 11</title>
<desc id="d">An original diagram showing the path Settings, then Apps, then Startup, with a toggle switched off next to a chat app.</desc>
<rect width="800" height="450" fill="#f4f6f8"/>
<rect x="60" y="40" width="680" height="370" rx="12" fill="#ffffff" stroke="#d5dde5" stroke-width="2"/>
<rect x="60" y="40" width="680" height="52" rx="12" fill="#0f2540"/>
<text x="84" y="73" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#ffffff">Settings</text>
<rect x="60" y="92" width="200" height="318" fill="#eef2f6"/>
<text x="80" y="130" font-family="Arial, sans-serif" font-size="17" fill="#5b6b7c">System</text>
<text x="80" y="165" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0f2540">Apps</text>
<text x="80" y="200" font-family="Arial, sans-serif" font-size="17" fill="#5b6b7c">Accounts</text>
<text x="80" y="235" font-family="Arial, sans-serif" font-size="17" fill="#5b6b7c">Windows Update</text>
<text x="284" y="140" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f2540">Apps &gt; Startup</text>
<text x="284" y="175" font-family="Arial, sans-serif" font-size="16" fill="#5b6b7c">Turn off apps you do not need at startup.</text>
<rect x="284" y="200" width="432" height="64" rx="8" fill="#ffffff" stroke="#d5dde5" stroke-width="2"/>
<text x="304" y="238" font-family="Arial, sans-serif" font-size="18" fill="#0f2540">Chat app</text>
<rect x="620" y="218" width="72" height="28" rx="14" fill="#c8d2dc"/>
<circle cx="634" cy="232" r="11" fill="#ffffff"/>
<rect x="284" y="280" width="432" height="64" rx="8" fill="#ffffff" stroke="#d5dde5" stroke-width="2"/>
<text x="304" y="318" font-family="Arial, sans-serif" font-size="18" fill="#0f2540">Music app</text>
<rect x="620" y="298" width="72" height="28" rx="14" fill="#e67e22"/>
<circle cx="678" cy="312" r="11" fill="#ffffff"/>
<text x="284" y="385" font-family="Arial, sans-serif" font-size="15" fill="#5b6b7c">Path: Settings &gt; Apps &gt; Startup — switch Off to stop an app opening at startup.</text>
</svg>
